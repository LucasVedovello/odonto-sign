name: Daily Database Backup

on:
  schedule:
    # Múltiplos horários (UTC): se o agendador do GitHub pular um run
    # (atraso/limpeza por inatividade), outro horário pega no mesmo dia.
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Run pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # set -e garante que uma falha do pg_dump aborte o step
          # (sem isso, o `echo` seguinte mascararia o erro com exit 0).
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL não configurado"
            exit 1
          fi
          FILENAME="backup-$(date +'%Y-%m-%d_%H-%M-%S').sql"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner \
            --no-acl \
            --format=plain \
            > "$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"

      - name: Validate backup file
        run: |
          set -euo pipefail
          FILE="${BACKUP_FILE:-}"
          # 1) O arquivo precisa existir.
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "::error::Backup não foi gerado: ${FILE:-<não definido>} — provável falha do pg_dump"
            exit 1
          fi
          # 2) E precisa ter tamanho maior que 1KB (um dump válido nunca é tão pequeno).
          MIN_BYTES=1024
          SIZE=$(stat -c%s "$FILE")
          if [ "$SIZE" -lt "$MIN_BYTES" ]; then
            echo "::error::Backup vazio ou pequeno demais ($SIZE bytes < $MIN_BYTES bytes): $FILE — pg_dump provavelmente falhou"
            exit 1
          fi
          echo "Backup válido: $FILE ($(du -h "$FILE" | cut -f1) / $SIZE bytes)"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          # Anotação de erro (aparece na lista de Actions e no topo do run)
          # + resumo do job, deixando a falha visível no GitHub sem serviço externo.
          echo "::error::❌ Backup diário FALHOU (run ${{ github.run_id }}). Verifique os logs e o secret SUPABASE_DB_URL."
          {
            echo "## ❌ Backup diário falhou"
            echo ""
            echo "O backup do banco não foi concluído com sucesso."
            echo ""
            echo "- **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- **Quando:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "Cheque se o secret \`SUPABASE_DB_URL\` está válido e se o banco está acessível."
          } >> "$GITHUB_STEP_SUMMARY"
